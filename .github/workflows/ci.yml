name: Python CI

on:
  push:
    branches: [ main, develop, more_features ]
  pull_request:
    branches: [ main, develop, more_features ]

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@v5
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.11' # Match the project's requires-python version

    - name: Install uv
      run: pip install uv

    - name: Create virtual environment
      run: uv venv

    - name: Install dependencies
      run: uv sync --all-extras --dev

    - name: Run ruff linter
      run: uv run ruff check .

    - name: Run tests
      run: uv run pytest tests/