name: Python CI

on:
  push:
    branches: [ main, develop, more_features ]
  pull_request:
    branches: [ main, develop, more_features ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11' # Match the project's requires-python version

    - name: Activate virtual environment and install dependencies
      run: |
        python -m venv .venv
        source .venv/bin/activate
        pip install -e . ruff pytest pytest-asyncio

    - name: Run ruff linter
      run: |
        source .venv/bin/activate
        ruff check .

    - name: Run tests
      run: |
        source .venv/bin/activate
        PYTHONPATH=$PWD pytest tests/ -v
